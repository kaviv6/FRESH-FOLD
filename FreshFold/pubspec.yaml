name: freshfold_app
description: FreshFold laundry app — customer, rider and admin experience in one Flutter app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  mobile_scanner: ^6.0.2
  flutter_cashfree_pg_sdk: ^2.4.0+52
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  open_file: ^3.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Run `dart run flutter_launcher_icons` after dropping the source image at
# assets/icon/icon.png to (re)generate every platform's launcher icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: false
  macos:
    generate: false
